quarkus.application.name=windsurf-service

windsurf.api-key=0837

quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
quarkus.rest-client.overpass.url=https://overpass-api.de
quarkus.rest-client.overpass.read-timeout=120000

quarkus.http.port=8080

quarkus.swagger-ui.always-include=true

quarkus.http.auth.permission.permit-all.paths=/*
quarkus.http.auth.permission.permit-all.policy=permit

# H2 file-based database (persists across restarts)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./windsurf-db;AUTO_SERVER=TRUE
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
